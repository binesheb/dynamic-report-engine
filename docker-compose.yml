services:
  reportforge:
    build: .
    ports:
      - "8000:8000"
    environment:
      REPORTFORGE_ENV: ${REPORTFORGE_ENV:-production}
      REPORTFORGE_SECRET_KEY: ${REPORTFORGE_SECRET_KEY:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
