name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Validate dependency consistency
        run: python -m pip check
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Verify Docker Compose binds the API to loopback
        run: |
          docker compose config --format json | python -c 'import json,sys; ports=json.load(sys.stdin)["services"]["reportforge"]["ports"]; assert any(p.get("host_ip") == "127.0.0.1" and str(p.get("published")) == "8000" and str(p.get("target")) == "8000" for p in ports), ports'
