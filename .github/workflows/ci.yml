name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Validate dependency consistency
        run: python -m pip check
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Run security configuration tests
        run: python -m unittest discover -s tests -v
      - name: Build Docker image
        run: docker build --pull --tag dynamic-report-engine:ci .
      - name: Smoke-test container dependencies
        run: |
          docker run --rm --env REPORTFORGE_ENV=development dynamic-report-engine:ci python -c "import backend.main, cryptography, psycopg, pymysql, pyodbc"
      - name: Smoke-test container health endpoint
        run: |
          docker run --rm --detach --env REPORTFORGE_ENV=development --name dynamic-report-engine-ci --publish 127.0.0.1:8000:8000 dynamic-report-engine:ci
          trap 'docker rm --force dynamic-report-engine-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs dynamic-report-engine-ci
          exit 1
